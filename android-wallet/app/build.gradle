plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.idrama.pay'
    compileSdk 35

    defaultConfig {
        // New package ID avoids signature-conflict with older test builds,
        // so v2.2 can install even when an older iDrama Pay is still present.
        applicationId 'ai.idrama.pay.v22'
        minSdk 21
        targetSdk 35
        versionCode 22
        versionName '2.2'
    }
}
