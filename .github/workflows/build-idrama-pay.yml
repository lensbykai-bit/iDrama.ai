name: Build iDrama Pay APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-wallet/**'
      - '.github/workflows/build-idrama-pay.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install and patch app assets
        shell: bash
        run: |
          mkdir -p android-wallet/app/src/main/assets
          base64 --decode android-wallet/app_icon.b64 > android-wallet/app/src/main/res/drawable/ic_launcher_art.webp
          cp android-wallet/app/src/main/res/drawable/ic_launcher_art.webp android-wallet/app/src/main/assets/app_icon.webp
          cat android-wallet/app_html.part1 android-wallet/app_html.part2 android-wallet/app_html.part3 | base64 --decode | gunzip > android-wallet/app/src/main/assets/index.html
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('android-wallet/app/src/main/assets/index.html')
          s=p.read_text()
          s=s.replace('iDrama Pay • v2.4','iDrama Pay • v3.3').replace('iDrama Pay • v2.5','iDrama Pay • v3.3').replace('iDrama Pay • v2.6','iDrama Pay • v3.3')
          s=s.replace('          <div class="f"><label>Telegram Link រឿងពេញ</label><input id="autoTelegram" placeholder="https://t.me/c/1234567890/123"></div>\n','')
          s=s.replace('      <div class="f"><label>Telegram Link រឿងពេញ (Default)</label><input id="telegramInput" placeholder="https://t.me/c/1234567890/123"></div>\n','')
          s=s.replace('      <div class="notice okbox">⚡ QR Auto + Telegram Bot: Connected ✓<br><span class="hint">API/Secret នៅ Server។ អតិថិជនត្រូវចុច Connect Telegram Bot ម្តងសម្រាប់ Order នីមួយៗ មុនពេល Bot អាចផ្ញើ Link ទៅគណនីរបស់គេ។</span></div>\n','      <div class="notice okbox">⚡ QR Auto: Connected ✓<br><span class="hint">បង្កើត KHQR ដោយស្វ័យប្រវត្តិ និង Auto Verify ការទូទាត់។</span></div>\n')
          s=s.replace('      <div class="btnrow"><button class="btn soft" id="openTelegram">បើក Telegram</button><button class="btn soft" id="exportData">ចែករំលែក Backup</button></div>\n','      <div class="btnrow"><button class="btn soft" id="exportData">ចែករំលែក Backup</button></div>\n')
          s=s.replace("$('brandInput').value=settings.brand;$('telegramInput').value=settings.telegram;$('noteInput').value=settings.note;","$('brandInput').value=settings.brand;$('noteInput').value=settings.note;")
          s=s.replace("$('autoCurrency').value=settings.currency;$('autoTelegram').value=settings.telegram||'';updateCard();","$('autoCurrency').value=settings.currency;updateCard();")
          s=s.replace("settings={brand:$('brandInput').value.trim()||defaults.brand,telegram:$('telegramInput').value.trim(),note:","settings={brand:$('brandInput').value.trim()||defaults.brand,telegram:'',note:")
          s=s.replace("$('openTelegram').onclick=()=>openUrl(settings.telegram);","")
          s=s.replace(",tg=$('autoTelegram').value.trim();",";").replace("telegram_url:tg","telegram_url:''")
          s=re.sub(r"    let tgBox='';\n    if\(data\.telegram_bind_url&&data\.telegram_target_set\)\{.*?    out\.innerHTML=", "    const tgBox='';\n    out.innerHTML=", s, flags=re.S)
          s=re.sub(r"      let deliveryHtml='';\n      if\(data\.delivery==='sent'\)\{.*?      out\.innerHTML=", "      stopAutoPolling();\n      const deliveryHtml='';\n      out.innerHTML=", s, flags=re.S)
          s=s.replace("        const c=$('connectAfterPaid');if(c)c.onclick=()=>openUrl(currentAuto.telegram_bind_url);\n","")
          s=s.replace("      if(data.delivery==='waiting_telegram'&&!autoPollTimer)autoPollTimer=setInterval(()=>checkAutoPayment(false),5000);\n","")
          s=s.replace("addPaidHistory(currentAuto.amount,currentAuto.currency,currentAuto.orderId,data.delivery==='sent'?'Auto Verify + Telegram ✓':'Auto Verify Bakong ✓');","addPaidHistory(currentAuto.amount,currentAuto.currency,currentAuto.orderId,'Auto Verify KHQR ✓');")

          card_js=r'''function rr(x,a,b,w,h,r){r=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
          function loadImg(src){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src})}
          async function makeBrandedQr(src,meta={}){
            const [qr,logo]=await Promise.all([loadImg(src),loadImg('app_icon.webp')]);
            const W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
            let bg=x.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#050309');bg.addColorStop(.48,'#120612');bg.addColorStop(1,'#050308');x.fillStyle=bg;x.fillRect(0,0,W,H);
            for(let i=0;i<22;i++){const y=45+i*82;x.strokeStyle='rgba(255,24,126,'+(0.045+(i%4)*0.01)+')';x.lineWidth=2;x.beginPath();x.moveTo(0,y);x.lineTo(W,y-160);x.stroke()}
            // chrome outer frame
            x.shadowColor='#ff1780';x.shadowBlur=38;let og=x.createLinearGradient(22,20,W-22,H-20);og.addColorStop(0,'#ffffff');og.addColorStop(.06,'#ff5aa8');og.addColorStop(.14,'#4d4e59');og.addColorStop(.5,'#101019');og.addColorStop(.86,'#ff2d90');og.addColorStop(1,'#ffffff');x.strokeStyle=og;x.lineWidth=13;rr(x,34,28,W-68,H-56,55);x.stroke();x.shadowBlur=0;
            x.strokeStyle='#ff167f';x.lineWidth=4;rr(x,48,42,W-96,H-84,48);x.stroke();

            // big mascot/icon block, raised 3D
            x.shadowColor='#ff1884';x.shadowBlur=34;let mg=x.createLinearGradient(58,50,310,320);mg.addColorStop(0,'#ffffff');mg.addColorStop(.20,'#ffc8e2');mg.addColorStop(.58,'#ff3b99');mg.addColorStop(1,'#640128');x.fillStyle=mg;rr(x,66,60,258,258,54);x.fill();x.shadowBlur=0;
            x.save();rr(x,82,76,226,226,46);x.clip();x.drawImage(logo,82,76,226,226);x.restore();

            // PAYMENT raised plaque
            x.shadowColor='#ff1680';x.shadowBlur=34;let pg=x.createLinearGradient(345,98,785,260);pg.addColorStop(0,'#39071e');pg.addColorStop(.28,'#120812');pg.addColorStop(.66,'#2a0618');pg.addColorStop(1,'#5d0a31');x.fillStyle=pg;rr(x,342,95,455,175,32);x.fill();x.shadowBlur=0;
            x.strokeStyle='#ff2a8e';x.lineWidth=6;rr(x,342,95,455,175,32);x.stroke();x.strokeStyle='rgba(255,255,255,.4)';x.lineWidth=2;rr(x,353,106,433,153,27);x.stroke();
            let tg=x.createLinearGradient(370,110,760,245);tg.addColorStop(0,'#fff');tg.addColorStop(.37,'#fef6fa');tg.addColorStop(.68,'#ff5ba8');tg.addColorStop(1,'#a7004b');x.fillStyle=tg;x.font='900 78px system-ui';x.textAlign='center';x.textBaseline='middle';x.shadowColor='#ff1884';x.shadowBlur=18;x.fillText('PAYMENT',570,184);x.shadowBlur=0;

            // KHQR crowned-looking badge
            let kg=x.createLinearGradient(820,96,1000,230);kg.addColorStop(0,'#ff6ab3');kg.addColorStop(.48,'#ff1780');kg.addColorStop(1,'#7d0036');x.shadowColor='#ff1780';x.shadowBlur=28;x.fillStyle=kg;rr(x,818,110,190,132,34);x.fill();x.shadowBlur=0;x.strokeStyle='#fff';x.lineWidth=3;rr(x,826,118,174,116,28);x.stroke();x.fillStyle='#fff';x.font='900 38px system-ui';x.textAlign='center';x.fillText('KHQR',913,176);

            // info panel
            x.shadowColor='#ff1780';x.shadowBlur=25;let ig=x.createLinearGradient(62,350,1018,780);ig.addColorStop(0,'#242332');ig.addColorStop(.16,'#151620');ig.addColorStop(.72,'#080911');ig.addColorStop(1,'#260718');x.fillStyle=ig;rr(x,64,340,952,470,42);x.fill();x.shadowBlur=0;x.strokeStyle='#ff2d91';x.lineWidth=6;rr(x,64,340,952,470,42);x.stroke();x.strokeStyle='rgba(255,255,255,.25)';x.lineWidth=2;rr(x,78,354,924,442,34);x.stroke();
            const brand=String(meta.brand||settings.brand||'iDrama_ai_Official').slice(0,34),amt=String(meta.amount||money($('amount').value,$('currency').value)),oid=String(meta.orderId||$('orderId').value||'');
            x.textAlign='left';x.fillStyle='#ff55a7';x.font='900 44px system-ui';x.fillText('▣',118,420);x.fillStyle='#a0a4b0';x.font='700 32px system-ui';x.fillText('Merchant',220,397);x.fillStyle='#fff';x.font='900 50px system-ui';x.fillText(brand,220,448);
            x.strokeStyle='rgba(255,255,255,.19)';x.lineWidth=2;x.beginPath();x.moveTo(110,486);x.lineTo(940,486);x.stroke();
            x.fillStyle='#ff55a7';x.font='900 43px system-ui';x.fillText('●●',116,565);x.fillStyle='#a0a4b0';x.font='700 32px system-ui';x.fillText('Amount',220,545);x.fillStyle='#ff1780';x.font='900 80px system-ui';x.fillText(amt,220,620);
            x.strokeStyle='rgba(255,255,255,.19)';x.beginPath();x.moveTo(110,656);x.lineTo(940,656);x.stroke();
            x.fillStyle='#ff55a7';x.font='900 44px system-ui';x.fillText('▤',118,735);x.fillStyle='#a0a4b0';x.font='700 32px system-ui';x.fillText('Order ID',220,715);x.fillStyle='#fff';x.font='850 44px system-ui';x.fillText(oid,415,715);

            // big square QR panel, scan-safe
            x.shadowColor='#ff1780';x.shadowBlur=46;let fg=x.createLinearGradient(52,835,1028,1745);fg.addColorStop(0,'#ffffff');fg.addColorStop(.08,'#ff8fc5');fg.addColorStop(.18,'#737580');fg.addColorStop(.32,'#171821');fg.addColorStop(.70,'#0b0c12');fg.addColorStop(.90,'#ff378f');fg.addColorStop(1,'#ffffff');x.fillStyle=fg;rr(x,56,840,968,968,56);x.fill();x.shadowBlur=0;
            x.strokeStyle='#ff1880';x.lineWidth=6;rr(x,56,840,968,968,56);x.stroke();
            x.fillStyle='#fff';rr(x,92,876,896,896,34);x.fill();
            const qpad=26,qsize=896-qpad*2;x.imageSmoothingEnabled=false;x.drawImage(qr,92+qpad,876+qpad,qsize,qsize);

            // footer trust card
            let fg2=x.createLinearGradient(78,1835,1002,1910);fg2.addColorStop(0,'#2b0a1d');fg2.addColorStop(.45,'#130713');fg2.addColorStop(1,'#330a22');x.fillStyle=fg2;rr(x,78,1830,924,75,24);x.fill();x.shadowColor='#ff1780';x.shadowBlur=18;x.strokeStyle='#ff3f9b';x.lineWidth=4;rr(x,78,1830,924,75,24);x.stroke();x.shadowBlur=0;
            x.fillStyle='#fff';rr(x,94,1839,56,56,14);x.fill();x.save();rr(x,98,1843,48,48,11);x.clip();x.drawImage(logo,98,1843,48,48);x.restore();
            x.textAlign='left';x.fillStyle='#fff';x.font='800 28px system-ui';x.fillText('iDrama_ai_Official',175,1859);x.fillStyle='#ff36a0';x.font='800 24px system-ui';x.fillText('Secure Payment • 10 នាទី',175,1890);
            // shield icon
            x.strokeStyle='#ff5aa9';x.lineWidth=5;x.beginPath();x.moveTo(906,1845);x.lineTo(934,1835);x.lineTo(962,1845);x.lineTo(962,1868);x.quadraticCurveTo(948,1890,934,1899);x.quadraticCurveTo(920,1890,906,1868);x.closePath();x.stroke();x.beginPath();x.moveTo(920,1863);x.lineTo(930,1873);x.lineTo(948,1853);x.stroke();
            return c.toDataURL('image/png',1)
          }'''
          s=re.sub(r"async function makeBrandedQr\(src\)\{.*?\n\}\ndocument\.querySelectorAll", card_js+"\ndocument.querySelectorAll", s, flags=re.S, count=1)
          s=s.replace("const sh=$('shareAutoPaid');if(sh)sh.onclick=()=>shareImage(currentAuto.image,'iDrama-'+currentAuto.orderId,autoShareText(currentAuto));","const sh=$('shareAutoPaid');if(sh)sh.onclick=async()=>{const img=await makeBrandedQr(currentAuto.image,{amount:money(currentAuto.amount,currentAuto.currency),orderId:currentAuto.orderId,brand:settings.brand});shareImage(img,'iDrama-'+currentAuto.orderId,autoShareText(currentAuto))};")
          s=s.replace("const sh=$('shareAutoQr');if(sh)sh.onclick=()=>shareImage(currentAuto.image,'iDrama-'+currentAuto.orderId,autoShareText(currentAuto));","const sh=$('shareAutoQr');if(sh)sh.onclick=async()=>{const img=await makeBrandedQr(currentAuto.image,{amount:money(currentAuto.amount,currentAuto.currency),orderId:currentAuto.orderId,brand:settings.brand});shareImage(img,'iDrama-'+currentAuto.orderId,autoShareText(currentAuto))};")
          s=s.replace("const sv=$('saveAutoPaid');if(sv)sv.onclick=()=>saveImage(currentAuto.image,'iDrama-'+currentAuto.orderId);","const sv=$('saveAutoPaid');if(sv)sv.onclick=async()=>{const img=await makeBrandedQr(currentAuto.image,{amount:money(currentAuto.amount,currentAuto.currency),orderId:currentAuto.orderId,brand:settings.brand});saveImage(img,'iDrama-'+currentAuto.orderId)};")
          s=s.replace("const sv=$('saveAutoQr');if(sv)sv.onclick=()=>saveImage(currentAuto.image,'iDrama-'+currentAuto.orderId);","const sv=$('saveAutoQr');if(sv)sv.onclick=async()=>{const img=await makeBrandedQr(currentAuto.image,{amount:money(currentAuto.amount,currentAuto.currency),orderId:currentAuto.orderId,brand:settings.brand});saveImage(img,'iDrama-'+currentAuto.orderId)};")
          p.write_text(s)
          PY
          grep -q 'iDrama Pay • v3.3' android-wallet/app/src/main/assets/index.html
          grep -q "fillText('KHQR'" android-wallet/app/src/main/assets/index.html
          ! grep -q 'Telegram Link រឿងពេញ' android-wallet/app/src/main/assets/index.html

      - name: Build APK
        run: gradle -p android-wallet clean assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-wallet/app/build/outputs/apk/debug/app-debug.apk iDrama-Pay-v3.3.apk

      - name: Verify APK
        shell: bash
        run: |
          test -s iDrama-Pay-v3.3.apk
          unzip -t iDrama-Pay-v3.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iDrama-Pay-v3.3-APK
          path: iDrama-Pay-v3.3.apk
          retention-days: 30
