          .quickArrow{position:absolute;right:15px;bottom:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:900;background:rgba(255,44,128,.10);color:#ff2b7a}
          .qauto .quickArrow{background:rgba(255,164,0,.12);color:#ff9a00}.qhistory .quickArrow{background:rgba(157,78,255,.12);color:#9d4eff}.qsettings .quickArrow{background:rgba(25,137,255,.12);color:#1989ff}
