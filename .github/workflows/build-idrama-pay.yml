name: Build iDrama Pay APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-wallet/**'
      - '.github/workflows/build-idrama-pay.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android-wallet clean assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-wallet/app/build/outputs/apk/debug/app-debug.apk iDrama-Pay-v1.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iDrama-Pay-v1.4-APK
          path: iDrama-Pay-v1.4.apk
          retention-days: 30
