name: Build iDrama Pay APK
on:
  push:
    branches: [ main, 'fix/idrama-pay-v1.6-white-screen' ]
    paths: [ 'android-wallet/**', '.github/workflows/build-idrama-pay.yml' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and verify bundled screen
        run: |
          test -s android-wallet/app/src/main/assets/index.html
          gradle -p android-wallet clean assembleDebug --no-daemon
          cp android-wallet/app/build/outputs/apk/debug/app-debug.apk iDrama-Pay-v1.6.apk
          unzip -t iDrama-Pay-v1.6.apk
          unzip -p iDrama-Pay-v1.6.apk assets/index.html | grep -q 'Personal Wallet · v1.6'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify iDrama-Pay-v1.6.apk
      - uses: actions/upload-artifact@v4
        with:
          name: iDrama-Pay-v1.6-APK
          path: iDrama-Pay-v1.6.apk
          retention-days: 30
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test offline launch on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash android-wallet/smoke-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iDrama-Pay-v1.6-Android-test
          path: android-wallet/test-output/
          retention-days: 30
