name: Build iDrama Pay APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-wallet/**'
      - '.github/workflows/build-idrama-pay.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install and patch app assets
        shell: bash
        run: |
          mkdir -p android-wallet/app/src/main/assets
          base64 --decode android-wallet/app_icon.b64 > android-wallet/app/src/main/res/drawable/ic_launcher_art.webp
          cat android-wallet/app_html.part1 android-wallet/app_html.part2 android-wallet/app_html.part3 | base64 --decode | gunzip > android-wallet/app/src/main/assets/index.html
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('android-wallet/app/src/main/assets/index.html')
          s=p.read_text()
          s=s.replace('iDrama Pay • v2.4','iDrama Pay • v2.9').replace('iDrama Pay • v2.5','iDrama Pay • v2.9').replace('iDrama Pay • v2.6','iDrama Pay • v2.9')
          s=s.replace('          <div class="f"><label>Telegram Link រឿងពេញ</label><input id="autoTelegram" placeholder="https://t.me/c/1234567890/123"></div>\n','')
          s=s.replace('      <div class="f"><label>Telegram Link រឿងពេញ (Default)</label><input id="telegramInput" placeholder="https://t.me/c/1234567890/123"></div>\n','')
          s=s.replace('      <div class="notice okbox">⚡ QR Auto + Telegram Bot: Connected ✓<br><span class="hint">API/Secret នៅ Server។ អតិថិជនត្រូវចុច Connect Telegram Bot ម្តងសម្រាប់ Order នីមួយៗ មុនពេល Bot អាចផ្ញើ Link ទៅគណនីរបស់គេ។</span></div>\n','      <div class="notice okbox">⚡ QR Auto: Connected ✓<br><span class="hint">បង្កើត KHQR ដោយស្វ័យប្រវត្តិ និង Auto Verify ការទូទាត់។</span></div>\n')
          s=s.replace('      <div class="btnrow"><button class="btn soft" id="openTelegram">បើក Telegram</button><button class="btn soft" id="exportData">ចែករំលែក Backup</button></div>\n','      <div class="btnrow"><button class="btn soft" id="exportData">ចែករំលែក Backup</button></div>\n')
          s=s.replace("$('brandInput').value=settings.brand;$('telegramInput').value=settings.telegram;$('noteInput').value=settings.note;","$('brandInput').value=settings.brand;$('noteInput').value=settings.note;")
          s=s.replace("$('autoCurrency').value=settings.currency;$('autoTelegram').value=settings.telegram||'';updateCard();","$('autoCurrency').value=settings.currency;updateCard();")
          s=s.replace("settings={brand:$('brandInput').value.trim()||defaults.brand,telegram:$('telegramInput').value.trim(),note:","settings={brand:$('brandInput').value.trim()||defaults.brand,telegram:'',note:")
          s=s.replace("$('openTelegram').onclick=()=>openUrl(settings.telegram);","")
          s=s.replace(",tg=$('autoTelegram').value.trim();",";").replace("telegram_url:tg","telegram_url:''")
          s=re.sub(r"    let tgBox='';\n    if\(data\.telegram_bind_url&&data\.telegram_target_set\)\{.*?    out\.innerHTML=", "    const tgBox='';\n    out.innerHTML=", s, flags=re.S)
          s=re.sub(r"      let deliveryHtml='';\n      if\(data\.delivery==='sent'\)\{.*?      out\.innerHTML=", "      stopAutoPolling();\n      const deliveryHtml='';\n      out.innerHTML=", s, flags=re.S)
          s=s.replace("        const c=$('connectAfterPaid');if(c)c.onclick=()=>openUrl(currentAuto.telegram_bind_url);\n","")
          s=s.replace("      if(data.delivery==='waiting_telegram'&&!autoPollTimer)autoPollTimer=setInterval(()=>checkAutoPayment(false),5000);\n","")
          s=s.replace("addPaidHistory(currentAuto.amount,currentAuto.currency,currentAuto.orderId,data.delivery==='sent'?'Auto Verify + Telegram ✓':'Auto Verify Bakong ✓');","addPaidHistory(currentAuto.amount,currentAuto.currency,currentAuto.orderId,'Auto Verify KHQR ✓');")

          card_js=r'''function rr(x,a,b,w,h,r){r=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
          async function makeBrandedQr(src,meta={}){
            return await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{try{
              const W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
              let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#05050a');g.addColorStop(.5,'#0b0610');g.addColorStop(1,'#040308');x.fillStyle=g;x.fillRect(0,0,W,H);
              // subtle cyber lines
              x.strokeStyle='rgba(255,22,126,.20)';x.lineWidth=2;
              for(let i=0;i<14;i++){x.beginPath();x.moveTo(0,90+i*125);x.lineTo(180+i*24,0);x.stroke();x.beginPath();x.moveTo(W,140+i*120);x.lineTo(W-170-i*20,0);x.stroke()}
              // outer frame
              x.shadowColor='#ff147f';x.shadowBlur=24;x.strokeStyle='#ff147f';x.lineWidth=7;rr(x,38,34,W-76,H-68,46);x.stroke();x.shadowBlur=0;
              // brand header
              x.fillStyle='#ff177f';rr(x,80,80,150,150,34);x.fill();x.fillStyle='#fff';x.font='900 92px system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText('▶',155,154);
              x.textAlign='left';x.fillStyle='#fff';x.font='900 78px system-ui';x.fillText('iDrama',270,140);
              x.fillStyle='#ff2b90';x.font='800 42px system-ui';x.fillText('AI OFFICIAL',272,205);
              x.fillStyle='#ff177f';rr(x,815,82,180,82,30);x.fill();x.fillStyle='#fff';x.font='900 42px system-ui';x.textAlign='center';x.fillText('KHQR',905,123);
              // merchant/info panel
              x.fillStyle='rgba(7,10,18,.96)';rr(x,90,275,900,500,34);x.fill();x.strokeStyle='#ff147f';x.lineWidth=4;x.stroke();
              const brand=String(meta.brand||settings.brand||'iDrama_ai_Official').slice(0,34),amt=String(meta.amount||money($('amount').value,$('currency').value)),oid=String(meta.orderId||$('orderId').value||'');
              x.textAlign='left';x.fillStyle='#8e95a4';x.font='700 36px system-ui';x.fillText('Merchant',155,345);
              x.fillStyle='#fff';x.font='900 51px system-ui';x.fillText(brand,155,405);
              x.strokeStyle='rgba(255,255,255,.16)';x.lineWidth=2;x.beginPath();x.moveTo(150,440);x.lineTo(925,440);x.stroke();
              x.fillStyle='#8e95a4';x.font='700 36px system-ui';x.fillText('Amount',155,510);
              x.fillStyle='#ff177f';x.font='900 78px system-ui';x.fillText(amt,155,590);
              x.strokeStyle='rgba(255,255,255,.16)';x.beginPath();x.moveTo(150,625);x.lineTo(925,625);x.stroke();
              x.fillStyle='#8e95a4';x.font='700 36px system-ui';x.fillText('Order ID',155,690);
              x.fillStyle='#fff';x.font='850 45px system-ui';x.fillText(oid,155,744);
              // QR container
              x.shadowColor='#ff147f';x.shadowBlur=28;x.fillStyle='#fff';rr(x,100,825,880,780,38);x.fill();x.shadowBlur=0;
              const q=74;x.imageSmoothingEnabled=false;x.drawImage(im,100+q,825+q,880-q*2,690-q*2);
              x.fillStyle='#ff177f';x.font='900 58px system-ui';x.textAlign='center';x.fillText('KHQR',540,1510);
              x.fillStyle='#4b5563';x.font='700 38px system-ui';x.fillText('Scan to Pay',540,1560);
              // expiry footer
              x.fillStyle='rgba(255,23,127,.10)';rr(x,150,1645,780,110,30);x.fill();x.strokeStyle='#ff147f';x.lineWidth=3;x.stroke();
              x.fillStyle='#fff';x.font='800 39px system-ui';x.fillText('ផុតកំណត់: 10 នាទី',540,1700);
              // trust footer
              x.fillStyle='#9da3ae';x.font='700 30px system-ui';x.fillText('iDrama.ai • Secure KHQR Payment',540,1825);
              resolve(c.toDataURL('image/png',1));
            }catch(e){reject(e)}};im.onerror=reject;im.src=src})
          }'''
          s=re.sub(r"async function makeBrandedQr\(src\)\{.*?\n\}\ndocument\.querySelectorAll", card_js+"\ndocument.querySelectorAll", s, flags=re.S, count=1)
          s=s.replace("const sv=$('saveAutoPaid');if(sv)sv.onclick=async()=>{const img=await makeBrandedQr(currentAuto.image,{amount:money(currentAuto.amount,currentAuto.currency),orderId:currentAuto.orderId,brand:settings.brand});saveImage(img,'iDrama-'+currentAuto.orderId)};","const sv=$('saveAutoPaid');if(sv)sv.onclick=()=>saveImage(currentAuto.image,'iDrama-'+currentAuto.orderId);")
          s=s.replace("const sh=$('shareAutoPaid');if(sh)sh.onclick=()=>shareImage(currentAuto.image,'iDrama-'+currentAuto.orderId,autoShareText(currentAuto));","const sh=$('shareAutoPaid');if(sh)sh.onclick=async()=>{const img=await makeBrandedQr(currentAuto.image,{amount:money(currentAuto.amount,currentAuto.currency),orderId:currentAuto.orderId,brand:settings.brand});shareImage(img,'iDrama-'+currentAuto.orderId,autoShareText(currentAuto))};")
          s=s.replace("const sv=$('saveAutoQr');if(sv)sv.onclick=async()=>{const img=await makeBrandedQr(currentAuto.image,{amount:money(currentAuto.amount,currentAuto.currency),orderId:currentAuto.orderId,brand:settings.brand});saveImage(img,'iDrama-'+currentAuto.orderId)};","const sv=$('saveAutoQr');if(sv)sv.onclick=()=>saveImage(currentAuto.image,'iDrama-'+currentAuto.orderId);")
          s=s.replace("const sh=$('shareAutoQr');if(sh)sh.onclick=()=>shareImage(currentAuto.image,'iDrama-'+currentAuto.orderId,autoShareText(currentAuto));","const sh=$('shareAutoQr');if(sh)sh.onclick=async()=>{const img=await makeBrandedQr(currentAuto.image,{amount:money(currentAuto.amount,currentAuto.currency),orderId:currentAuto.orderId,brand:settings.brand});shareImage(img,'iDrama-'+currentAuto.orderId,autoShareText(currentAuto))};")
          p.write_text(s)
          PY
          grep -q 'iDrama Pay • v2.9' android-wallet/app/src/main/assets/index.html
          grep -q "fillText('KHQR'" android-wallet/app/src/main/assets/index.html
          ! grep -q 'Telegram Link រឿងពេញ' android-wallet/app/src/main/assets/index.html

      - name: Build APK
        run: gradle -p android-wallet clean assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-wallet/app/build/outputs/apk/debug/app-debug.apk iDrama-Pay-v2.9.apk

      - name: Verify APK
        shell: bash
        run: |
          test -s iDrama-Pay-v2.9.apk
          unzip -t iDrama-Pay-v2.9.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iDrama-Pay-v2.9-APK
          path: iDrama-Pay-v2.9.apk
          retention-days: 30
