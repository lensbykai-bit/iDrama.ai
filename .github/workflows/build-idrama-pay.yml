          .stat35 .statIco{width:48px;height:48px;border-radius:17px;margin:-4px auto 8px;display:grid;place-items:center;color:#fff;font-weight:950;font-size:23px;box-shadow:inset 0 3px 8px rgba(255,255,255,.5),0 9px 17px rgba(101,55,85,.16)}
          .stat35.usd .statIco{background:linear-gradient(145deg,#ff2380,#ff6db5)}.stat35.khr .statIco{background:linear-gradient(145deg,#ffc324,#ff8e00)}.stat35.tx .statIco{background:linear-gradient(145deg,#8a48ff,#d06cff)}
          .stat35 b{display:block;font-size:18px}.stat35 span{font-size:11px;color:var(--muted)}.stat35 i{display:none}
          .sectionTitle35{font-size:24px;font-weight:950;margin:26px 4px 14px;position:relative}.sectionTitle35:after{content:"";display:block;width:42px;height:4px;border-radius:9px;margin-top:7px;background:linear-gradient(90deg,#ff2b7a,#ff7ab8)}
          .quickGrid35{display:grid;grid-template-columns:1fr 1fr;gap:14px}
          .quick35{position:relative;min-height:185px;text-align:left;border:1px solid rgba(255,56,144,.16);border-radius:28px;padding:22px 20px 18px;background:linear-gradient(145deg,#fff,#fff8fc);box-shadow:0 16px 34px rgba(255,65,150,.12);color:var(--text);overflow:hidden}
          .quick35:before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-90px;top:-85px;background:rgba(255,91,166,.08)}
          .quick35 .quickIcon{width:70px;height:70px;border-radius:22px;display:grid;place-items:center;font-size:38px;font-weight:950;color:#fff;box-shadow:inset 0 5px 10px rgba(255,255,255,.48),0 12px 24px rgba(75,34,65,.16);transform:rotate(-4deg);margin-bottom:18px}
          .qnormal .quickIcon{background:linear-gradient(145deg,#ff1d77,#ff63ae)}.qauto .quickIcon{background:linear-gradient(145deg,#ffd138,#ff9a00)}.qhistory .quickIcon{background:linear-gradient(145deg,#8a4dff,#c567ff)}.qsettings .quickIcon{background:linear-gradient(145deg,#21a8ff,#0d79e8)}
