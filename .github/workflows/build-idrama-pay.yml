          s=s.replace('</head>','<style>'+home35_css+'</style></head>')



          card_js=r'''function rr(x,a,b,w,h,r){r=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
          function loadImg(src){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src})}
          async function makeBrandedQr(src,meta={}){
            const [qr,logo]=await Promise.all([loadImg(src),loadImg('app_icon.webp')]);
            const W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
            let bg=x.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#050309');bg.addColorStop(.48,'#120612');bg.addColorStop(1,'#050308');x.fillStyle=bg;x.fillRect(0,0,W,H);
            for(let i=0;i<22;i++){const y=45+i*82;x.strokeStyle='rgba(255,24,126,'+(0.045+(i%4)*0.01)+')';x.lineWidth=2;x.beginPath();x.moveTo(0,y);x.lineTo(W,y-160);x.stroke()}
            // chrome outer frame
            x.shadowColor='#ff1780';x.shadowBlur=38;let og=x.createLinearGradient(22,20,W-22,H-20);og.addColorStop(0,'#ffffff');og.addColorStop(.06,'#ff5aa8');og.addColorStop(.14,'#4d4e59');og.addColorStop(.5,'#101019');og.addColorStop(.86,'#ff2d90');og.addColorStop(1,'#ffffff');x.strokeStyle=og;x.lineWidth=13;rr(x,34,28,W-68,H-56,55);x.stroke();x.shadowBlur=0;
            x.strokeStyle='#ff167f';x.lineWidth=4;rr(x,48,42,W-96,H-84,48);x.stroke();

            // big mascot/icon block, raised 3D
            x.shadowColor='#ff1884';x.shadowBlur=34;let mg=x.createLinearGradient(58,50,310,320);mg.addColorStop(0,'#ffffff');mg.addColorStop(.20,'#ffc8e2');mg.addColorStop(.58,'#ff3b99');mg.addColorStop(1,'#640128');x.fillStyle=mg;rr(x,66,60,258,258,54);x.fill();x.shadowBlur=0;
            x.save();rr(x,82,76,226,226,46);x.clip();x.drawImage(logo,82,76,226,226);x.restore();

            // PAYMENT raised plaque
            x.shadowColor='#ff1680';x.shadowBlur=34;let pg=x.createLinearGradient(345,98,785,260);pg.addColorStop(0,'#39071e');pg.addColorStop(.28,'#120812');pg.addColorStop(.66,'#2a0618');pg.addColorStop(1,'#5d0a31');x.fillStyle=pg;rr(x,342,95,455,175,32);x.fill();x.shadowBlur=0;
            x.strokeStyle='#ff2a8e';x.lineWidth=6;rr(x,342,95,455,175,32);x.stroke();x.strokeStyle='rgba(255,255,255,.4)';x.lineWidth=2;rr(x,353,106,433,153,27);x.stroke();
