name: Build iDrama Pay APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-wallet/**'
      - '.github/workflows/build-idrama-pay.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install and patch app assets
        shell: bash
        run: |
          mkdir -p android-wallet/app/src/main/assets
          base64 --decode android-wallet/app_icon.b64 > android-wallet/app/src/main/res/drawable/ic_launcher_art.webp
          cp android-wallet/app/src/main/res/drawable/ic_launcher_art.webp android-wallet/app/src/main/assets/app_icon.webp
          cat android-wallet/app_html.part1 android-wallet/app_html.part2 android-wallet/app_html.part3 | base64 --decode | gunzip > android-wallet/app/src/main/assets/index.html
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('android-wallet/app/src/main/assets/index.html')
          s=p.read_text()
          s=re.sub(r'iDrama Pay • v[0-9]+[.][0-9]+', 'iDrama Pay • v3.5', s)
          s=s.replace('          <div class="f"><label>Telegram Link រឿងពេញ</label><input id="autoTelegram" placeholder="https://t.me/c/1234567890/123"></div>\n','')
          s=s.replace('      <div class="f"><label>Telegram Link រឿងពេញ (Default)</label><input id="telegramInput" placeholder="https://t.me/c/1234567890/123"></div>\n','')
          s=s.replace('      <div class="notice okbox">⚡ QR Auto + Telegram Bot: Connected ✓<br><span class="hint">API/Secret នៅ Server។ អតិថិជនត្រូវចុច Connect Telegram Bot ម្តងសម្រាប់ Order នីមួយៗ មុនពេល Bot អាចផ្ញើ Link ទៅគណនីរបស់គេ។</span></div>\n','      <div class="notice okbox">⚡ QR Auto: Connected ✓<br><span class="hint">បង្កើត KHQR ដោយស្វ័យប្រវត្តិ និង Auto Verify ការទូទាត់។</span></div>\n')
          s=s.replace('      <div class="btnrow"><button class="btn soft" id="openTelegram">បើក Telegram</button><button class="btn soft" id="exportData">ចែករំលែក Backup</button></div>\n','      <div class="btnrow"><button class="btn soft" id="exportData">ចែករំលែក Backup</button></div>\n')
          s=s.replace("$('brandInput').value=settings.brand;$('telegramInput').value=settings.telegram;$('noteInput').value=settings.note;","$('brandInput').value=settings.brand;$('noteInput').value=settings.note;")
          s=s.replace("$('autoCurrency').value=settings.currency;$('autoTelegram').value=settings.telegram||'';updateCard();","$('autoCurrency').value=settings.currency;updateCard();")
          s=s.replace("settings={brand:$('brandInput').value.trim()||defaults.brand,telegram:$('telegramInput').value.trim(),note:","settings={brand:$('brandInput').value.trim()||defaults.brand,telegram:'',note:")
          s=s.replace("$('openTelegram').onclick=()=>openUrl(settings.telegram);","")
          s=s.replace(",tg=$('autoTelegram').value.trim();",";").replace("telegram_url:tg","telegram_url:''")
          s=re.sub(r"    let tgBox='';\n    if\(data\.telegram_bind_url&&data\.telegram_target_set\)\{.*?    out\.innerHTML=", "    const tgBox='';\n    out.innerHTML=", s, flags=re.S)
          s=re.sub(r"      let deliveryHtml='';\n      if\(data\.delivery==='sent'\)\{.*?      out\.innerHTML=", "      stopAutoPolling();\n      const deliveryHtml='';\n      out.innerHTML=", s, flags=re.S)
          s=s.replace("        const c=$('connectAfterPaid');if(c)c.onclick=()=>openUrl(currentAuto.telegram_bind_url);\n","")
          s=s.replace("      if(data.delivery==='waiting_telegram'&&!autoPollTimer)autoPollTimer=setInterval(()=>checkAutoPayment(false),5000);\n","")
          s=s.replace("addPaidHistory(currentAuto.amount,currentAuto.currency,currentAuto.orderId,data.delivery==='sent'?'Auto Verify + Telegram ✓':'Auto Verify Bakong ✓');","addPaidHistory(currentAuto.amount,currentAuto.currency,currentAuto.orderId,'Auto Verify KHQR ✓');")

          # Home UX/UI v3.5: replace old home layout with a visibly new 3D wallet dashboard
          s=s.replace('<div class="logo">♥</div>','<div class="logo appLogo"><img src="app_icon.webp" alt="iDrama"></div>')
          home_html=r'''
          <section id="home" class="page active home35">
            <div class="walletHero">
              <div class="heroCopy">
                <div class="eyebrow">PAYMENT WALLET</div>
                <h1>iDrama Pay</h1>
                <p>គ្រប់គ្រង KHQR ទូទាត់ ប្រវត្តិការទទួលប្រាក់ និងការកំណត់ ក្នុង App មួយ។</p>
              </div>
              <div class="walletArt" aria-hidden="true">
                <div class="coin c1">$</div><div class="coin c2">៛</div>
                <div class="walletBody"><span>♥</span></div>
              </div>
            </div>

            <div class="stats35">
              <div class="stat35 usd"><div class="statIco">$</div><div><b id="sumUsd">$0.00</b><span>សរុប USD</span></div><i>›</i></div>
              <div class="stat35 khr"><div class="statIco">៛</div><div><b id="sumKhr">៛0</b><span>សរុប KHR</span></div><i>›</i></div>
              <div class="stat35 tx"><div class="statIco">●</div><div><b id="txCount">0</b><span>ប្រតិបត្តិការ</span></div><i>›</i></div>
            </div>

            <div class="sectionTitle35">ប្រើប្រាស់រហ័ស</div>
            <div class="quickGrid35">
              <button class="quick35 qnormal" type="button" data-go="qr">
                <span class="quickIcon">▦</span><span class="quickArrow">›</span>
                <b>QR CODE ធម្មតា</b><small>Upload KHQR ឬ QR របស់អ្នក</small>
              </button>
              <button class="quick35 qauto" type="button" id="goAuto">
                <span class="quickIcon">⚡</span><span class="quickArrow">›</span>
                <b>QR CODE Auto</b><small>Auto Verify KHQR</small>
              </button>
              <button class="quick35 qhistory" type="button" data-go="history">
                <span class="quickIcon">◷</span><span class="quickArrow">›</span>
                <b>ប្រវត្តិ</b><small>មើលកំណត់ត្រាទទួលប្រាក់</small>
              </button>
              <button class="quick35 qsettings" type="button" data-go="settings">
                <span class="quickIcon">⚙</span><span class="quickArrow">›</span>
                <b>ការកំណត់</b><small>Brand និង Currency</small>
              </button>
            </div>

            <div class="status35"><div id="homeStatus" class="notice">កំពុងពិនិត្យស្ថានភាព...</div></div>
          </section>'''
          s=re.sub(r'<section id="home" class="page active">.*?</section>',home_html,s,flags=re.S,count=1)

          # Home UX/UI refresh: pastel wallet + soft 3D cards, without changing payment logic
          s=s.replace('Auto Verify + Telegram Bot Delivery','Auto Verify KHQR')
          s=s.replace('Upload KHQR តាមរូបភាព','Upload KHQR ឬ QR របស់អ្នក')
          s=s.replace('Brand, Telegram និង Currency','Brand និង Currency')
          premium_css=r'''
          :root{
            --ux-pink:#ff2f8d;--ux-pink2:#ff77b8;--ux-ink:#171522;--ux-muted:#786b7c;
            --ux-card:rgba(255,255,255,.92);--ux-line:rgba(255,60,145,.18);
            --ux-shadow:0 14px 34px rgba(255,62,147,.16),0 4px 12px rgba(66,36,60,.08);
          }
          html{scroll-behavior:smooth}
          body{
            background:
              radial-gradient(circle at 8% 6%,rgba(255,193,222,.55),transparent 24%),
              radial-gradient(circle at 92% 22%,rgba(255,224,239,.6),transparent 28%),
              linear-gradient(180deg,#fff9fc 0%,#fff4f9 55%,#fff 100%)!important;
            color:var(--ux-ink);
          }
          body,.app,.page,.screen{letter-spacing:.01em}
          header,.header,.topbar,.app-header{
            position:relative;z-index:5;
            backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
          }
          .card,.panel,.tile,.service-card,.menu-card,.stat-card,.wallet-card,[class*="card"]{
            border:1px solid var(--ux-line)!important;
            border-radius:26px!important;
            box-shadow:var(--ux-shadow)!important;
            transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
          }
          .card:active,.tile:active,.service-card:active,.menu-card:active,[class*="card"]:active{
            transform:scale(.985);
            box-shadow:0 8px 20px rgba(255,62,147,.13)!important;
          }
          .hero,.banner,.wallet-hero,[class*="hero"]{
            border-radius:30px!important;
            overflow:hidden!important;
            box-shadow:0 18px 42px rgba(255,42,137,.22)!important;
            border:1px solid rgba(255,255,255,.75)!important;
          }
          h1,h2,h3,.title,.section-title{letter-spacing:-.02em}
          h2,.section-title{font-weight:900!important}
          button,.btn,.action,.cta{
            border-radius:18px!important;
            min-height:50px;
            font-weight:800!important;
            transition:transform .15s ease,filter .15s ease,box-shadow .15s ease;
          }
          button:active,.btn:active,.action:active,.cta:active{transform:scale(.97)}
          input,select,textarea{
            border-radius:18px!important;
            min-height:52px;
            border:1.5px solid rgba(255,61,145,.18)!important;
            background:rgba(255,255,255,.92)!important;
            box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
          }
          input:focus,select:focus,textarea:focus{
            outline:none!important;border-color:rgba(255,47,141,.55)!important;
            box-shadow:0 0 0 4px rgba(255,47,141,.09)!important;
          }
          nav,.nav,.bottom-nav,.tabbar,[class*="bottom"][class*="nav"]{
            background:rgba(255,255,255,.92)!important;
            backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
            border-top:1px solid rgba(255,72,151,.13)!important;
            box-shadow:0 -8px 28px rgba(67,40,59,.08)!important;
          }
          .active,[aria-selected="true"],.nav .on,.bottom-nav .on{
            color:var(--ux-pink)!important;
          }
          .badge,.pill,[class*="badge"]{
            border-radius:999px!important;
            box-shadow:0 6px 16px rgba(255,47,141,.15);
          }
          .muted,.sub,.subtitle,.hint{color:var(--ux-muted)!important}
          .grid,.cards,.service-grid,[class*="grid"]{gap:16px!important}
          @media(max-width:520px){
            body{padding-bottom:92px}
            .card,.panel,.tile,.service-card,.menu-card,.stat-card,[class*="card"]{border-radius:22px!important}
            .hero,.banner,.wallet-hero,[class*="hero"]{border-radius:24px!important}
            .grid,.cards,.service-grid,[class*="grid"]{gap:12px!important}
            h1{font-size:clamp(26px,8vw,38px)!important}
            h2{font-size:clamp(22px,6.6vw,32px)!important}
          }
          '''
          s=s.replace('</head>','<style>'+premium_css+'</style></head>')
          home35_css=r'''
          .appLogo{padding:0!important;overflow:hidden!important;background:#fff!important}
          .appLogo img{width:100%;height:100%;object-fit:cover;display:block}
          .home35{padding-bottom:8px}
          .walletHero{position:relative;min-height:205px;border-radius:30px;padding:24px 210px 24px 24px;overflow:hidden;color:#fff;background:
            radial-gradient(circle at 78% 28%,rgba(255,255,255,.28),transparent 25%),
            linear-gradient(135deg,#ff2078 0%,#ff3891 46%,#ff78bb 100%);box-shadow:0 18px 44px rgba(255,41,131,.24);border:1px solid rgba(255,255,255,.76)}
          .walletHero:before{content:"";position:absolute;inset:-120px -90px auto auto;width:300px;height:300px;border-radius:50%;border:52px solid rgba(255,255,255,.10)}
          .heroCopy{position:relative;z-index:3}.eyebrow{font-size:13px;letter-spacing:.16em;font-weight:900;opacity:.92}
          .walletHero h1{font-size:38px!important;margin:8px 0 7px!important;line-height:1.04;text-shadow:0 5px 14px rgba(132,0,55,.18)}
          .walletHero p{font-size:14px;line-height:1.65;margin:0;opacity:.96}
          .walletArt{position:absolute;right:22px;top:23px;width:170px;height:160px;z-index:2;filter:drop-shadow(0 16px 18px rgba(140,0,55,.22))}
          .walletBody{position:absolute;right:0;bottom:12px;width:142px;height:104px;border-radius:32px 24px 34px 28px;background:linear-gradient(145deg,#ffbedc,#ff4e9a 58%,#e31870);border:4px solid rgba(255,255,255,.82);box-shadow:inset 0 6px 12px rgba(255,255,255,.48),inset 0 -10px 18px rgba(139,0,55,.18),0 12px 22px rgba(150,0,61,.26);transform:rotate(3deg)}
          .walletBody:before{content:"";position:absolute;right:-6px;top:31px;width:48px;height:42px;border-radius:16px;background:linear-gradient(145deg,#ffecf5,#ff65aa);border:3px solid rgba(255,255,255,.9);box-shadow:0 6px 12px rgba(140,0,55,.18)}
          .walletBody span{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);font-size:42px;color:#fff;text-shadow:0 5px 10px rgba(150,0,60,.25)}
          .coin{position:absolute;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:950;font-size:24px;color:#fff4c3;background:radial-gradient(circle at 33% 25%,#fff8a8,#ffc400 47%,#e38100 76%);border:5px solid #ffe96c;box-shadow:inset 0 3px 5px rgba(255,255,255,.9),0 8px 15px rgba(153,80,0,.22)}
          .coin.c1{left:8px;top:0;transform:rotate(-9deg)}.coin.c2{right:13px;top:7px;transform:rotate(11deg) scale(.9)}
          .stats35{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 6px}
