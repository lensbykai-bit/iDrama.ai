<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iDrama.ai Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;600;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17191d;font-family:Inter,Battambang,sans-serif}button,input,textarea,select{font:inherit}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(430px,100%);background:#fff;border:1px solid #e8eaf0;border-radius:22px;padding:26px;box-shadow:0 20px 60px #0001}.brand{font-size:28px;font-weight:800}.brand b{color:#ff365d}.muted{color:#7e838d;font-size:13px}.f{display:grid;gap:6px;margin-top:13px}.f label{font-family:Battambang;font-weight:700;font-size:13px}input,textarea,select{width:100%;border:1px solid #e5e7ec;border-radius:11px;padding:10px 11px;outline:0}input:focus,textarea:focus,select:focus{border-color:#ff9bb0;box-shadow:0 0 0 3px #fff0f3}textarea{min-height:100px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.pink{background:#ff365d;color:#fff}.soft{background:#fff0f3;color:#ff365d}.dark{background:#202126;color:#fff}.danger{background:#fff0f0;color:#d94242}.linkbtn{border:0;background:transparent;color:#ff365d;font-family:Battambang;font-weight:700;cursor:pointer;padding:6px 0}.pw{position:relative}.pw input{padding-right:76px}.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#f4f5f7;border-radius:8px;padding:6px 9px;font-size:12px;cursor:pointer}.loginActions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}.top{height:66px;background:#fff;border-bottom:1px solid #e8eaf0;display:flex;align-items:center;padding:0 18px;position:sticky;top:0;z-index:9}.top .brand{font-size:21px}.top .right{margin-left:auto;display:flex;gap:8px}.main{max-width:1100px;margin:auto;padding:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat,.panel{background:#fff;border:1px solid #e8eaf0;border-radius:16px;padding:16px}.stat b{font-size:26px;display:block}.stat span{font-family:Battambang;color:#7e838d;font-size:13px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.head h2{font-family:Battambang;margin:0;font-size:19px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 12px}.full{grid-column:1/-1}.check{display:flex;gap:14px;margin-top:12px}.check label{font-family:Battambang;font-size:13px;font-weight:700}.check input{width:auto}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.list{display:grid;gap:9px}.row{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;border:1px solid #eceef2;border-radius:13px;padding:8px}.thumb{width:54px;height:70px;border-radius:9px;object-fit:cover;background:linear-gradient(145deg,#ff365d,#ff7043)}.row h3{font-family:Battambang;margin:0;font-size:14px}.meta{font-size:12px;color:#7e838d}.row .r{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.row .btn{padding:7px 9px;font-size:12px}.msg{font-family:Battambang;font-size:13px;color:#15855c;margin-top:8px}.err{color:#d94242}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs .btn.active{background:#202126;color:#fff}@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.row{grid-template-columns:48px 1fr}.thumb{width:48px;height:64px}.row .r{grid-column:1/-1;justify-content:flex-start}.main{padding:12px}}@media(max-width:440px){.stats{grid-template-columns:1fr}.top .right a{display:none}}
</style>
</head>
<body>
<div id="login" class="login">
  <form id="loginForm" class="box">
    <div class="brand">iDrama<b>.ai</b></div>
    <div class="muted">Admin Panel</div>
    <div class="f"><label>Email</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="f"><label>Password</label><div class="pw"><input id="password" type="password" autocomplete="current-password" required><button type="button" id="showPw">បង្ហាញ</button></div></div>
    <button class="btn pink" style="width:100%;margin-top:16px">ចូល Admin</button>
    <div class="loginActions"><button type="button" id="forgot" class="linkbtn">ភ្លេច Password?</button><span class="muted">iDrama.ai</span></div>
    <div id="loginMsg" class="msg err"></div>
  </form>
</div>
<div id="reset" class="login hide">
  <form id="resetForm" class="box">
    <div class="brand">iDrama<b>.ai</b></div>
    <div class="muted">កំណត់ Password ថ្មី</div>
    <div class="f"><label>Password ថ្មី</label><div class="pw"><input id="newPassword" type="password" minlength="8" required><button type="button" id="showNewPw">បង្ហាញ</button></div></div>
    <div class="f"><label>បញ្ជាក់ Password ថ្មី</label><input id="confirmPassword" type="password" minlength="8" required></div>
    <button class="btn pink" style="width:100%;margin-top:16px">រក្សាទុក Password ថ្មី</button>
    <div id="resetMsg" class="msg"></div>
  </form>
</div>
<div id="app" class="hide">
<header class="top"><div class="brand">iDrama<b>.ai</b> <span class="muted">Admin</span></div><div class="right"><a class="btn soft" href="index.html" target="_blank">មើល Website</a><button id="logout" class="btn dark">ចាកចេញ</button></div></header>
<main class="main">
<div class="stats"><div class="stat"><b id="s1">0</b><span>រឿងសរុប</span></div><div class="stat"><b id="s2">0</b><span>ភាគសរុប</span></div><div class="stat"><b id="s3">0</b><span>Published</span></div></div>
<div class="tabs"><button class="btn active" id="tabMovies">គ្រប់គ្រងរឿង</button><button class="btn soft" id="tabEps">គ្រប់គ្រងភាគ</button></div>
<section id="movies">
<div id="movieFormWrap" class="panel hide"><div class="head"><h2 id="movieFormTitle">បន្ថែមរឿងថ្មី</h2></div><form id="movieForm"><input id="mid" type="hidden"><div class="grid"><div class="f full"><label>ចំណងជើង *</label><input id="title" required></div><div class="f"><label>ប្រភេទ</label><select id="category"><option value="ai">AI Drama</option><option value="live">រឿងមនុស្ស</option><option value="anime">រឿងគំនូរ</option></select></div><div class="f"><label>Genre</label><input id="genre"></div><div class="f full"><label>Poster URL</label><input id="poster" type="url"></div><div class="f"><label>Poster Word</label><input id="word" value="DRAMA"></div><div class="f"><label>Accent 0-359</label><input id="accent" type="number" min="0" max="359" value="340"></div><div class="f"><label>Views</label><input id="views" type="number" min="0" value="0"></div><div class="f full"><label>ពិពណ៌នា</label><textarea id="description"></textarea></div></div><div class="check"><label><input id="featured" type="checkbox"> Featured</label><label><input id="published" type="checkbox" checked> Published</label></div><div class="actions"><button class="btn pink">រក្សាទុក</button><button type="button" id="cancelMovie" class="btn soft">បោះបង់</button></div><div id="movieMsg" class="msg"></div></form></div>
<div class="panel"><div class="head"><h2>បញ្ជីរឿង</h2><button id="newMovie" class="btn pink">+ បន្ថែមរឿង</button></div><div class="f" style="margin:0 0 12px"><input id="search" placeholder="ស្វែងរករឿង..."></div><div id="movieList" class="list"></div></div>
</section>
<section id="eps" class="hide">
<div class="panel"><div class="head"><h2>ជ្រើសរើសរឿង</h2></div><select id="movieSelect"></select></div>
<div class="panel"><div class="head"><h2>បន្ថែម / កែភាគ</h2></div><form id="epForm"><input id="eid" type="hidden"><div class="grid"><div class="f"><label>លេខភាគ *</label><input id="epn" type="number" min="1" required></div><div class="f"><label>ចំណងជើងភាគ</label><input id="ept"></div><div class="f"><label>រយៈពេល</label><input id="epd" placeholder="12:30"></div><div class="f full"><label>Video URL</label><input id="epv" type="url"></div></div><div class="check"><label><input id="epp" type="checkbox" checked> Published</label></div><div class="actions"><button class="btn pink">រក្សាទុកភាគ</button><button type="button" id="cancelEp" class="btn soft">សម្អាត</button></div><div id="epMsg" class="msg"></div></form></div>
<div class="panel"><div class="head"><h2>បញ្ជីភាគ</h2></div><div id="epList" class="list"></div></div>
</section>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script>
const db=window.supabase.createClient('https://xiziwoquiatlpkihkdoh.supabase.co','sb_publishable_3TmqRI06OhjnXkxelxDwWQ__YsvBgXQ');
let items=[],episodes=[];const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
function togglePw(input,button){const i=$(input),b=$(button);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'បង្ហាញ':'លាក់'}
$('showPw').onclick=()=>togglePw('password','showPw');$('showNewPw').onclick=()=>togglePw('newPassword','showNewPw');
async function enter(user){const {data,error}=await db.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){await db.auth.signOut();$('loginMsg').textContent='គណនីនេះមិនមានសិទ្ធិ Admin ទេ';return}$('login').classList.add('hide');$('reset').classList.add('hide');$('app').classList.remove('hide');await load()}
async function boot(){const {data:{session}}=await db.auth.getSession();if(session&&!location.hash.includes('type=recovery')&&!location.search.includes('reset=1'))enter(session.user)}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').className='msg';$('loginMsg').textContent='កំពុងចូល...';const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').className='msg err';$('loginMsg').textContent='Password មិនត្រឹមត្រូវ។ បើភ្លេច សូមចុច “ភ្លេច Password?”'}else enter(data.user)};
$('forgot').onclick=async()=>{const email=$('email').value.trim();if(!email){$('loginMsg').className='msg err';$('loginMsg').textContent='សូមបញ្ចូល Email ជាមុនសិន';return}$('loginMsg').className='msg';$('loginMsg').textContent='កំពុងផ្ញើ Recovery Email...';const redirectTo=location.origin+location.pathname+'?reset=1';const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo});if(error){$('loginMsg').className='msg err';$('loginMsg').textContent=error.message}else{$('loginMsg').className='msg';$('loginMsg').textContent='បានផ្ញើ Recovery Email រួច។ សូមពិនិត្យ Inbox/Spam របស់អ្នក។'}};
db.auth.onAuthStateChange(async(event,session)=>{if(event==='PASSWORD_RECOVERY'){location.hash='';$('login').classList.add('hide');$('app').classList.add('hide');$('reset').classList.remove('hide')}if(event==='SIGNED_IN'&&session&&location.search.includes('reset=1')){$('login').classList.add('hide');$('app').classList.add('hide');$('reset').classList.remove('hide')}});
$('resetForm').onsubmit=async e=>{e.preventDefault();const p=$('newPassword').value,c=$('confirmPassword').value;$('resetMsg').className='msg';if(p!==c){$('resetMsg').className='msg err';$('resetMsg').textContent='Password ទាំងពីរមិនដូចគ្នា';return}if(p.length<8){$('resetMsg').className='msg err';$('resetMsg').textContent='Password ត្រូវមានយ៉ាងហោចណាស់ 8 តួ';return}const {error}=await db.auth.updateUser({password:p});if(error){$('resetMsg').className='msg err';$('resetMsg').textContent=error.message;return}$('resetMsg').textContent='បានកំណត់ Password ថ្មីរួច ✓ កំពុងចូល Admin...';history.replaceState({},'',location.pathname);const {data:{user}}=await db.auth.getUser();if(user)setTimeout(()=>enter(user),600)};
$('logout').onclick=()=>db.auth.signOut().then(()=>location.reload());
async function load(){const [a,b]=await Promise.all([db.from('idrama_items').select('*').order('created_at',{ascending:false}),db.from('idrama_episodes').select('*').order('number')]);items=a.data||[];episodes=b.data||[];$('s1').textContent=items.length;$('s2').textContent=episodes.length;$('s3').textContent=items.filter(x=>x.published).length;renderMovies();fillSelect();renderEps()}
function grad(a){return `linear-gradient(145deg,hsl(${a||340} 78% 58%),hsl(${((a||340)+38)%360} 76% 44%))`}
function renderMovies(){let q=$('search').value.toLowerCase();let list=items.filter(x=>x.title.toLowerCase().includes(q));$('movieList').innerHTML=list.map(x=>`<div class="row">${x.poster?`<img class="thumb" src="${esc(x.poster)}">`:`<div class="thumb" style="background:${grad(x.accent)}"></div>`}<div><h3>${esc(x.title)}</h3><div class="meta">${esc(x.category)} · ${episodes.filter(e=>e.item_id===x.id).length} ភាគ ${x.published?'':'· Hidden'}</div></div><div class="r"><button class="btn soft" data-edit="${x.id}">កែ</button><button class="btn dark" data-ep="${x.id}">ភាគ</button><button class="btn danger" data-del="${x.id}">លុប</button></div></div>`).join('')||'<div class="muted">មិនទាន់មានរឿងទេ</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editMovie(b.dataset.edit));document.querySelectorAll('[data-ep]').forEach(b=>b.onclick=()=>{showEps();$('movieSelect').value=b.dataset.ep;renderEps()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delMovie(b.dataset.del))}
function resetMovie(){$('movieForm').reset();$('mid').value='';$('word').value='DRAMA';$('accent').value=340;$('views').value=0;$('published').checked=true;$('movieMsg').textContent=''}
$('newMovie').onclick=()=>{$('movieFormWrap').classList.remove('hide');resetMovie()};$('cancelMovie').onclick=()=>$('movieFormWrap').classList.add('hide');$('search').oninput=renderMovies;
function editMovie(id){let x=items.find(i=>i.id===id);$('mid').value=x.id;$('title').value=x.title;$('category').value=x.category;$('genre').value=x.genre;$('poster').value=x.poster;$('word').value=x.word;$('accent').value=x.accent;$('views').value=x.views;$('description').value=x.description;$('featured').checked=x.featured;$('published').checked=x.published;$('movieFormWrap').classList.remove('hide');window.scrollTo({top:120,behavior:'smooth'})}
$('movieForm').onsubmit=async e=>{e.preventDefault();let p={title:$('title').value.trim(),category:$('category').value,genre:$('genre').value.trim(),poster:$('poster').value.trim(),word:$('word').value.trim()||'DRAMA',accent:+$('accent').value||340,views:+$('views').value||0,description:$('description').value.trim(),featured:$('featured').checked,published:$('published').checked,updated_at:new Date().toISOString()},id=$('mid').value,r=id?await db.from('idrama_items').update(p).eq('id',id):await db.from('idrama_items').insert(p);$('movieMsg').textContent=r.error?r.error.message:'រក្សាទុករួចរាល់ ✓';if(!r.error){await load();setTimeout(()=>$('movieFormWrap').classList.add('hide'),400)}};
async function delMovie(id){let x=items.find(i=>i.id===id);if(!confirm('លុប '+x.title+' និងភាគទាំងអស់?'))return;await db.from('idrama_items').delete().eq('id',id);await load()}
function fillSelect(){let old=$('movieSelect').value;$('movieSelect').innerHTML=items.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');if(items.some(x=>x.id===old))$('movieSelect').value=old}
$('movieSelect').onchange=renderEps;
function renderEps(){let id=$('movieSelect').value,list=episodes.filter(e=>e.item_id===id);$('epList').innerHTML=list.map(e=>`<div class="row"><div class="thumb" style="height:54px;display:grid;place-items:center;background:#202126;color:#fff;font-weight:800">${e.number}</div><div><h3>${esc(e.title||('ភាគ '+e.number))}</h3><div class="meta">${esc(e.duration)} ${e.video_url?'· Video ✓':'· No video'}</div></div><div class="r"><button class="btn soft" data-eedit="${e.id}">កែ</button><button class="btn danger" data-edel="${e.id}">លុប</button></div></div>`).join('')||'<div class="muted">មិនទាន់មានភាគទេ</div>';document.querySelectorAll('[data-eedit]').forEach(b=>b.onclick=()=>editEp(b.dataset.eedit));document.querySelectorAll('[data-edel]').forEach(b=>b.onclick=()=>delEp(b.dataset.edel))}
function resetEp(){$('epForm').reset();$('eid').value='';$('epp').checked=true;$('epMsg').textContent=''}$('cancelEp').onclick=resetEp;
function editEp(id){let e=episodes.find(x=>x.id===id);$('eid').value=e.id;$('movieSelect').value=e.item_id;$('epn').value=e.number;$('ept').value=e.title;$('epd').value=e.duration;$('epv').value=e.video_url;$('epp').checked=e.published}
$('epForm').onsubmit=async e=>{e.preventDefault();let p={item_id:$('movieSelect').value,number:+$('epn').value,title:$('ept').value.trim(),duration:$('epd').value.trim(),video_url:$('epv').value.trim(),published:$('epp').checked,updated_at:new Date().toISOString()},id=$('eid').value,r=id?await db.from('idrama_episodes').update(p).eq('id',id):await db.from('idrama_episodes').insert(p);$('epMsg').textContent=r.error?r.error.message:'រក្សាទុករួចរាល់ ✓';if(!r.error){await load();resetEp()}};
async function delEp(id){if(!confirm('លុបភាគនេះ?'))return;await db.from('idrama_episodes').delete().eq('id',id);await load()}
function showMovies(){$('movies').classList.remove('hide');$('eps').classList.add('hide');$('tabMovies').className='btn active';$('tabEps').className='btn soft'}function showEps(){$('movies').classList.add('hide');$('eps').classList.remove('hide');$('tabMovies').className='btn soft';$('tabEps').className='btn active';fillSelect();renderEps()}$('tabMovies').onclick=showMovies;$('tabEps').onclick=showEps;boot();
</script>
</body></html>
